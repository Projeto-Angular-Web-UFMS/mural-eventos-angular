<article class="poster" [class]="categoryClass()" appTilt>
  <span class="pin" aria-hidden="true"></span>
  <div class="poster-band">
    <time class="poster-date" [attr.datetime]="event().data"
      ><span class="poster-day">{{ event().data | date: 'dd/MM' }}</span
      ><span class="poster-year">{{ event().data | date: '/yyyy' }}</span></time
    >
    <span class="poster-category">{{ event().categoria }}</span>
  </div>
  <div class="poster-body">
    <h2 class="poster-title" [id]="titleId()">
      <a [routerLink]="['/eventos', event().id]">{{ event().titulo }}</a>
    </h2>
    <p class="poster-place">{{ event().local }}</p>
    <button
      type="button"
      class="button"
      [class.button-primary]="interests.hasInterest(event().id)"
      [attr.aria-describedby]="titleId()"
      (click)="interests.toggle(event().id)"
    >
      {{ interests.hasInterest(event().id) ? 'Remover interesse' : 'Tenho interesse' }}
    </button>
  </div>
  @if (interests.hasInterest(event().id)) {
    <span class="stamp" aria-hidden="true">Na agenda</span>
  }
</article>
