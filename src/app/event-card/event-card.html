<article class="card">
  <h2 [id]="'event-' + event().id + '-title'">
    <a [routerLink]="['/eventos', event().id]">{{ event().titulo }}</a>
  </h2>
  <span class="badge">{{ event().categoria }}</span>
  <p>
    <time [attr.datetime]="event().data">{{ event().data | date: 'dd/MM/yyyy' }}</time>
  </p>
  <p>{{ event().local }}</p>
  <button
    type="button"
    class="button"
    [class.button-secondary]="interests.hasInterest(event().id)"
    [attr.aria-describedby]="'event-' + event().id + '-title'"
    (click)="interests.toggle(event().id)"
  >
    {{ interests.hasInterest(event().id) ? 'Remover interesse' : 'Tenho interesse' }}
  </button>
</article>
